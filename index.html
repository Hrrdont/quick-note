<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>速记</title>
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --line:#e6e1d8; --fg:#1f2328; --dim:#8b8578;
    --accent:#c0563b; --accent-soft:#f4e6e1; --ok:#3f7d5c; --ok-soft:#e6f0ea;
    --shadow:0 1px 2px rgba(31,35,40,.05),0 8px 24px rgba(31,35,40,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --card:#1b1e24; --line:#2a2f38; --fg:#e9ecf1; --dim:#8f97a6;
      --accent:#e07a5f; --accent-soft:#2a201d; --ok:#5ec49a; --ok-soft:#1a2620;
      --shadow:none;
    }
    meta[name=theme-color]{content:"#14161a"}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:16px/1.55 -apple-system,"Segoe UI","Microsoft YaHei UI",sans-serif;
    display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom);
  }
  header{padding:20px 18px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.5px}
  h1 .sub{display:block;font-size:12px;font-weight:400;color:var(--dim);letter-spacing:1px;margin-top:3px}
  .badge{background:var(--accent);color:#fff;border-radius:999px;font-size:13px;padding:4px 11px;font-weight:600;font-variant-numeric:tabular-nums}
  .badge.zero{background:var(--ok-soft);color:var(--ok)}

  main{flex:1;overflow-y:auto;padding:6px 14px 100px}

  .composer{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px}
  textarea{
    width:100%;min-height:54px;max-height:180px;resize:none;border:0;outline:none;background:transparent;
    color:var(--fg);font:16px/1.55 inherit;padding:4px 0;
  }
  textarea::placeholder{color:var(--dim)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
  .hint{color:var(--dim);font-size:12px}
  button.add{border:0;border-radius:11px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;padding:10px 20px}
  button.add:disabled{opacity:.45}

  .banner{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}

  .tabs{display:flex;gap:6px;margin:2px 0 12px}
  .tabs button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:14px}
  .tabs button.on{background:var(--card);color:var(--fg);border-color:var(--fg);font-weight:600}

  .note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow)}
  .note .txt{white-space:pre-wrap;word-break:break-word;cursor:text}
  .note .meta{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
  .note .time{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  .note .acts{display:flex;gap:6px}
  .note .acts button{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:9px;padding:5px 10px;font-size:12px}
  .note .acts button.done{color:var(--ok);border-color:var(--ok)}
  .note.old{border-color:var(--accent)}
  .note.old .time{color:var(--accent)}
  .tag{display:inline-block;color:var(--accent);font-size:13px;margin-right:4px}

  .empty{color:var(--dim);text-align:center;padding:48px 20px;font-size:14px;line-height:2}
  .empty b{color:var(--fg)}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:20}
  .modal[hidden]{display:none}
  .sheet{width:100%;background:var(--card);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
  .sheet textarea{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);min-height:96px}
  .sheet .actions{display:flex;gap:8px;margin-top:12px}
  .sheet .actions button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:15px}
  .sheet .actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .sheet .actions button.danger{color:var(--accent)}

  footer{padding:0 18px 22px;color:var(--dim);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  footer button{border:0;background:transparent;color:var(--dim);font-size:12px;text-decoration:underline}
</style>
</head>
<body>
<header>
  <h1>速记<span class="sub">INBOX · 想到就写，每周清零</span></h1>
  <span class="badge" id="badge">0</span>
</header>

<main>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="一句话，想到什么写什么…（#标签 可选）"></textarea>
    <div class="bar">
      <span class="hint">回车记下 · Shift+回车换行</span>
      <button class="add" id="addBtn" disabled>记下</button>
    </div>
  </div>

  <div id="stale" class="banner" hidden></div>

  <div class="tabs">
    <button id="tabInbox" class="on">收件箱 <span id="nInbox"></span></button>
    <button id="tabArchive">归档 <span id="nArchive"></span></button>
  </div>

  <div id="list"></div>
</main>

<footer>
  <span id="info"></span>
  <span>
    <button id="exportBtn">导出</button>
    <button id="importBtn">导入</button>
  </span>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</footer>

<div class="modal" id="edit" hidden>
  <div class="sheet">
    <textarea id="editText"></textarea>
    <div class="actions">
      <button class="danger" id="editDel">删除</button>
      <button id="editCancel">取消</button>
      <button class="primary" id="editSave">保存</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'inbox.notes.v1';
  var $ = function (id) { return document.getElementById(id); };
  var load = function () { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
  var save = function (v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) { alert('存储失败：' + e.message); } };

  var notes = load();
  var tab = 'inbox';
  var editingId = null;
  var WEEK = 7 * 86400000;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function fmt(ts) {
    var d = new Date(ts), now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    var hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    if (sameDay) return '今天 ' + hm;
    var y = new Date(now.getTime() - 86400000);
    if (d.toDateString() === y.toDateString()) return '昨天 ' + hm;
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
  }
  function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 180) + 'px'; }
  function renderText(t) {
    return esc(t).replace(/#([^\s#]{1,16})/g, '<span class="tag">#$1</span>');
  }

  function inbox() { return notes.filter(function (n) { return !n.done; }).sort(function (a, b) { return b.createdAt - a.createdAt; }); }
  function archive() { return notes.filter(function (n) { return n.done; }).sort(function (a, b) { return b.doneAt - a.doneAt; }); }

  function render() {
    var ib = inbox(), ar = archive();
    $('badge').textContent = ib.length;
    $('badge').className = 'badge' + (ib.length ? '' : ' zero');
    $('nInbox').textContent = ib.length ? '(' + ib.length + ')' : '';
    $('nArchive').textContent = ar.length ? '(' + ar.length + ')' : '';
    $('tabInbox').className = tab === 'inbox' ? 'on' : '';
    $('tabArchive').className = tab === 'archive' ? 'on' : '';

    var list = tab === 'inbox' ? ib : ar;
    if (!list.length) {
      $('list').innerHTML = tab === 'inbox'
        ? '<div class="empty">收件箱是空的。<br><b>保持这样。</b><br>想到什么再往里丢。</div>'
        : '<div class="empty">还没有归档过的东西。</div>';
    } else {
      $('list').innerHTML = list.map(function (n) {
        var age = Date.now() - n.createdAt;
        var old = tab === 'inbox' && age > WEEK;
        return '<div class="note' + (old ? ' old' : '') + '" data-id="' + esc(n.id) + '">' +
          '<div class="txt">' + renderText(n.text) + '</div>' +
          '<div class="meta"><span class="time">' + fmt(tab === 'inbox' ? n.createdAt : n.doneAt) +
          (old ? ' · 放了 ' + Math.floor(age / 86400000) + ' 天' : '') + '</span>' +
          '<span class="acts">' +
          (tab === 'inbox'
            ? '<button class="done" data-act="done">归档</button>'
            : '<button data-act="restore">放回</button>') +
          '<button data-act="del">删除</button>' +
          '</span></div></div>';
      }).join('');
    }

    var oldOnes = ib.filter(function (n) { return Date.now() - n.createdAt > WEEK; });
    if (oldOnes.length) {
      $('stale').hidden = false;
      $('stale').textContent = '有 ' + oldOnes.length + ' 条放了超过一周还没处理 —— 要么归档，要么删掉，别让收件箱变成第二个收藏夹。';
    } else { $('stale').hidden = true; }

    $('info').textContent = '共 ' + notes.length + ' 条 · 未处理 ' + ib.length;
  }

  /* ---------- 输入 ---------- */
  function add() {
    var t = $('input').value.trim();
    if (!t) return;
    notes.push({ id: String(Date.now()) + '-' + Math.random().toString(36).slice(2, 5), text: t, createdAt: Date.now(), done: false, doneAt: 0 });
    save(notes);
    $('input').value = '';
    autoGrow($('input'));
    $('addBtn').disabled = true;
    tab = 'inbox';
    render();
    $('input').focus();
  }

  $('input').addEventListener('input', function () { autoGrow(this); $('addBtn').disabled = !this.value.trim(); });
  $('input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); add(); }
  });
  $('addBtn').addEventListener('click', add);

  /* ---------- 列表操作 ---------- */
  $('list').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    var card = e.target.closest('.note');
    if (!card) return;
    var id = card.getAttribute('data-id');
    var note = notes.filter(function (n) { return n.id === id; })[0];
    if (!note) return;

    if (btn) {
      var act = btn.getAttribute('data-act');
      if (act === 'done') { note.done = true; note.doneAt = Date.now(); }
      else if (act === 'restore') { note.done = false; note.doneAt = 0; }
      else if (act === 'del') {
        if (!confirm('删除这条？')) return;
        notes = notes.filter(function (n) { return n.id !== id; });
      }
      save(notes); render();
      return;
    }
    openEdit(note);
  });

  /* ---------- 编辑 ---------- */
  function openEdit(note) {
    editingId = note.id;
    $('editText').value = note.text;
    $('edit').hidden = false;
    setTimeout(function () { $('editText').focus(); }, 50);
  }
  function closeEdit() { $('edit').hidden = true; editingId = null; }
  $('editCancel').addEventListener('click', closeEdit);
  $('editSave').addEventListener('click', function () {
    var n = notes.filter(function (x) { return x.id === editingId; })[0];
    if (n) { n.text = $('editText').value.trim() || n.text; save(notes); }
    closeEdit(); render();
  });
  $('editDel').addEventListener('click', function () {
    if (!confirm('删除这条？')) return;
    notes = notes.filter(function (x) { return x.id !== editingId; });
    save(notes); closeEdit(); render();
  });

  /* ---------- 标签页 ---------- */
  $('tabInbox').addEventListener('click', function () { tab = 'inbox'; render(); });
  $('tabArchive').addEventListener('click', function () { tab = 'archive'; render(); });

  /* ---------- 导入导出 ---------- */
  function download(name, text) {
    var blob = new Blob([text], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1200);
  }
  $('exportBtn').addEventListener('click', function () {
    download('inbox-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(notes, null, 2));
  });
  $('importBtn').addEventListener('click', function () { $('importFile').click(); });
  $('importFile').addEventListener('change', function (ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var incoming = JSON.parse(String(r.result));
        if (!Array.isArray(incoming)) throw new Error('不是数组');
        var ids = new Set(notes.map(function (n) { return n.id; }));
        var added = 0;
        incoming.forEach(function (n) {
          if (!n || !n.text || ids.has(n.id)) return;
          notes.push({ id: n.id || String(Date.now() + Math.random()), text: String(n.text).slice(0, 500), createdAt: n.createdAt || Date.now(), done: !!n.done, doneAt: n.doneAt || 0 });
          added++;
        });
        save(notes); render();
        alert('导入完成，新增 ' + added + ' 条');
      } catch (e) { alert('导入失败：' + e.message); }
    };
    r.readAsText(file, 'utf-8');
    ev.target.value = '';
  });

  render();
  $('input').focus();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
